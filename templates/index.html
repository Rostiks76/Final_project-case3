<!DOCTYPE html>
<html>
<head>
    <title>Викторина</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background: linear-gradient(135deg, #89C400, #32C2D7);
            min-height: 100vh;
        }
        .container {
            background: white;
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 { color: #433E4D; }
        .btn {
            background: #89C400;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
        }
        .btn:hover { background: #6ea000; }
        .btn-blue { background: #32C2D7; }
        .btn-blue:hover { background: #28a5b8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Добро пожаловать в Викторину!</h1>
        <p>Проверь свои знания и стань лучшим в таблице лидеров!</p>
        <a href="/start" class="btn">🎯 Начать викторину</a>
        <a href="/leaderboard" class="btn btn-blue">🏆 Таблица лидеров</a>
    </div>
</body>
</html>
