<!DOCTYPE html>
<html>
<head>
    <title>Вопрос</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; margin-top: 50px; background: #433E4D; }
        .container { background: white; max-width: 700px; margin: 0 auto; padding: 30px; border-radius: 20px; position: relative; }
        .option { background: #f0f0f0; padding: 12px; margin: 10px 0; border-radius: 10px; cursor: pointer; }
        .option:hover { background: #89C400; color: white; }
        .progress { color: #666; margin-bottom: 20px; }
        .btn { background: #32C2D7; color: white; padding: 10px 20px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 20px; }
        
        /* Модальное окно с результатом */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px 50px;
            border-radius: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            animation: bounce 0.3s ease;
        }
        .modal-content.correct {
            background: #89C400;
            color: white;
        }
        .modal-content.wrong {
            background: #e74c3c;
            color: white;
        }
        @keyframes bounce {
            0% { transform: scale(0.8); opacity: 0; }
            80% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="progress">Вопрос {{ current }} из {{ total }}</div>
        <h2>📌 {{ question.text }}</h2>
        <form method="POST" id="quizForm">
            {% for idx in range(1, 5) %}
                <div class="option" data-opt="{{ idx }}">
                    <input type="radio" name="answer" value="{{ idx }}" id="opt{{ idx }}" required>
                    <label for="opt{{ idx }}">{{ idx }}. {{ question.options[idx-1] }}</label>
                </div>
            {% endfor %}
            <button type="submit" class="btn" id="submitBtn">Ответить →</button>
        </form>
    </div>

    <!-- Модальное окно (скрыто по умолчанию) -->
    <div id="resultModal" class="modal" style="display: none;">
        <div id="modalContent" class="modal-content"></div>
    </div>

    <script>
        // Кликабельность блоков с вариантами ответов
        const options = document.querySelectorAll('.option');
        options.forEach(opt => {
            opt.addEventListener('click', function() {
                const radioId = 'opt' + this.dataset.opt;
                document.getElementById(radioId).checked = true;
            });
        });

        // Обработка отправки формы
        const form = document.getElementById('quizForm');
        const submitBtn = document.getElementById('submitBtn');
        
        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Останавливаем обычную отправку
            
            // Проверяем, выбран ли ответ
            const selected = document.querySelector('input[name="answer"]:checked');
            if (!selected) {
                alert('Пожалуйста, выберите вариант ответа!');
                return;
            }
            
            const selectedValue = selected.value;
            
            // Отправляем данные через fetch (AJAX)
            fetch(window.location.href, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'answer=' + selectedValue
            })
            .then(response => response.json())
            .then(data => {
                // Показываем модальное окно с результатом
                const modal = document.getElementById('resultModal');
                const modalContent = document.getElementById('modalContent');
                
                if (data.correct) {
                    modalContent.textContent = '✅ Правильно! ✅';
                    modalContent.className = 'modal-content correct';
                } else {
                    modalContent.textContent = '❌ Неправильно! Правильный ответ: ' + data.correct_answer + ' ❌';
                    modalContent.className = 'modal-content wrong';
                }
                
                modal.style.display = 'flex';
                
                // Через 1.5 секунды переходим к следующему вопросу
                setTimeout(() => {
                    window.location.href = data.next_url;
                }, 1500);
            });
        });
    </script>
</body>
</html>
