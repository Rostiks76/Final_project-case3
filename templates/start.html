<!DOCTYPE html>
<html>
<head>
    <title>Начать викторину</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #433E4D; }
        .container { background: white; max-width: 500px; margin: 0 auto; padding: 30px; border-radius: 20px; }
        input { padding: 10px; width: 80%; margin: 20px 0; font-size: 16px; }
        .btn { background: #89C400; color: white; padding: 12px 30px; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn:hover { background: #6ea000; }
    </style>
</head>
<body>
    <div class="container">
        <h2>👤 Введите ваше имя</h2>
        <form method="POST" action="/start">
            <input type="text" name="player_name" placeholder="Ваше имя..." required>
            <br>
            <button type="submit" class="btn">Начать викторину →</button>
        </form>
        <br>
        <a href="/">← На главную</a>
    </div>
</body>
</html>
